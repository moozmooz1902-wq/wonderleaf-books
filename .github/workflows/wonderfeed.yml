name: Wonderfeed - weekly video batch

# Builds a week of TikTok videos and attaches them as a downloadable artifact.
# You then schedule them in TikTok Studio, where you can tag the Shop product.
on:
  schedule:
    # 06:00 UTC every Sunday - gives you the batch before the week starts.
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos to build"
        required: false
        default: "7"
      dry_run:
        description: "Build with placeholder visuals (no API spend)"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tiktok/requirements.txt

      - name: Install dependencies
        working-directory: tiktok
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state (so angles keep rotating across runs)
        uses: actions/cache@v4
        with:
          path: tiktok/out/state.json
          key: wonderfeed-state-${{ github.run_id }}
          restore-keys: wonderfeed-state-

      - name: Build batch
        working-directory: tiktok
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          python -m wonderfeed.run \
            --count "${{ github.event.inputs.count || 7 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: wonderfeed-${{ github.run_number }}
          path: |
            tiktok/out/*.mp4
            tiktok/out/*.txt
          retention-days: 30
          if-no-files-found: error
